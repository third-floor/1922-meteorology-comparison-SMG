<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Object Record Comparator</title>

  <!-- Bootstrap + DataTables -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      margin: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .dataTables_wrapper .dataTables_filter input {
      border-radius: 8px;
      padding: 6px;
      margin-left: 0.5em;
    }
    .dual-panel {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .panel {
      flex: 1 1 45%;
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
    }
    .panel h5 {
      border-bottom: 2px solid #007bff33;
      padding-bottom: .5rem;
      margin-bottom: 1rem;
    }
    .field-row {
      border-bottom: 1px dashed #eee;
      padding: .25rem 0;
      font-size: .95rem;
      display: flex;
      justify-content: space-between;
    }
    .field-row strong {
      color: #333;
      width: 40%;
    }
    footer {
      text-align: center;
      font-size: .9rem;
      margin-top: 2rem;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🧭 Museum Object Record Comparator</h1>
    <p class="text-center text-muted mb-4">
      Compare entries between your <b>Meteorology Catalogue 1922</b> and the <b>Science Museum Group Collections Online</b>.
    </p>

    <!-- Search and filters -->
    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <input type="text" id="globalSearch" class="form-control" placeholder="🔍 Search all records..." style="min-width: 250px;">
      </div>
      <div>
        <button id="columnToggleBtn" class="btn btn-outline-primary btn-sm">🧩 Toggle Columns</button>
      </div>
    </div>

    <div class="table-responsive">
      <table id="recordsTable" class="table table-striped table-hover" style="width:100%">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>
      Built on the third-floor.
    </footer>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log("📂 Loading matched_records.csv ...");

      Papa.parse('matched_records.csv', {
        download: true,
        header: true,
        complete: function(results) {
          const data = results.data.filter(r => Object.keys(r).length > 1);

          // Columns to show initially in the table
          const visibleColumns = [
            "Catalogue number", "Object name", "Object/Inventory number",
            "uid", "identifier", "title"
          ];

          // Build columns dynamically (show only chosen ones)
          const columns = Object.keys(data[0])
            .filter(key => visibleColumns.includes(key))
            .map(k => ({ title: k, data: k }));

          const table = $('#recordsTable').DataTable({
            data: data,
            columns: columns,
            pageLength: 25,
            responsive: true,
            order: [[0, 'asc']],
          });

          // 🔍 Global search bar
          $('#globalSearch').on('keyup', function() {
            table.search(this.value).draw();
          });

          // 🧩 Column visibility toggles
          $('#columnToggleBtn').on('click', function() {
            let msg = 'Toggle columns by typing their number:\n\n';
            table.columns().every(function(idx) {
              msg += `[${idx}] ${this.header().textContent} ${this.visible() ? '(visible)' : '(hidden)'}\n`;
            });
            const input = prompt(msg + '\nEnter column numbers (comma-separated):');
            if (input) {
              input.split(',').map(i => i.trim()).forEach(num => {
                const col = table.column(parseInt(num));
                col.visible(!col.visible());
              });
            }
          });

          // Field groups for side-by-side comparison
          const meteorologyFields = [
            "Filename", "Catalogue number", "Object name", "Maker/Donor",
            "Date of creation", "Object entry information", "Object/Inventory number"
          ];
          const smgFields = [
            "uid", "identifier", "title", "description", "category",
            "material", "object_name", "date", "place", "maker", "image"
          ];

          // 🪄 Dual-panel comparison popup
          $('#recordsTable tbody').on('click', 'tr', function() {
            const rowData = table.row(this).data();
            if (!rowData) return;

            // Meteorology Catalogue panel
            let leftHTML = `<div class="panel"><h5>📘 Meteorology Catalogue 1922</h5>`;
            meteorologyFields.forEach(k => {
              if (k in rowData) {
                leftHTML += `<div class="field-row"><strong>${k}</strong><span>${rowData[k] || ''}</span></div>`;
              }
            });
            leftHTML += `</div>`;

            // Science Museum Group panel
            let rightHTML = `<div class="panel"><h5>🏛️ Science Museum Group Collections Online</h5>`;
            smgFields.forEach(k => {
              if (k in rowData) {
                let value = rowData[k] || '';
                // Make images clickable if URLs
                if (k === "image" && value) {
                  value = `<a href="${value}" target="_blank">View image 🔗</a>`;
                }
                rightHTML += `<div class="field-row"><strong>${k}</strong><span>${value}</span></div>`;
              }
            });
            rightHTML += `</div>`;

            const modalHTML = `
              <div class="modal fade" id="compareModal" tabindex="-1">
                <div class="modal-dialog modal-xl modal-dialog-scrollable">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">🔎 Compare Record</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body dual-panel">
                      ${leftHTML + rightHTML}
                    </div>
                  </div>
                </div>
              </div>
            `;

            // Remove existing modal if present
            $('#compareModal').remove();
            $('body').append(modalHTML);
            const modal = new bootstrap.Modal(document.getElementById('compareModal'));
            modal.show();
          });
        }
      });
    });
  </script>
</body>
</html>
